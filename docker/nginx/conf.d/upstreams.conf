# Clean Water — `http` darajasidagi umumiy e'lonlar (§4.1, §6).
#
# Bu fayl HAR DOIM yuklanadi: `default.conf` (HTTP bootstrap) ham,
# `tls.conf` (prod) ham unga tayanadi. Zonalar va upstream lar `http`
# kontekstiga tegishli va ikki marta e'lon qilinsa nginx umuman
# ishga tushmaydi — shuning uchun ular server bloklarida emas, shu yerda.

# §6: arizalar formasiga rate-limit. Zona IP bo'yicha.
limit_req_zone $binary_remote_addr zone=leads:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

# Telegram bot webhooki `worker` konteynerida turadi (§4.1, §4.6) — bot
# barqaror jarayonni talab qiladi va u Next.js qayta deploylaridan omon qoladi.
upstream worker_upstream {
    server worker:8081;
    keepalive 8;
}
