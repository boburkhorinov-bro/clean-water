# Clean Water — nginx (§4.1): TLS, rate-limit, CSP sarlavhalar, /media uzatish.
#
# HOLAT: hozir faqat HTTP (:80). TLS bloki domen va Let's Encrypt sertifikati
# tayyor bo'lgach yoqiladi — TZ §7 «Kritik yo'l», 0-punkt (loyiha egasida).

# §6: arizalar formasiga rate-limit. Zona IP bo'yicha.
limit_req_zone $binary_remote_addr zone=leads:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ── Xavfsizlik sarlavhalari (§6) ─────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP: Kinescope pleyeri iframe orqali ulanadi, Telegram Mini App skripti
    # telegram.org dan keladi. Boshqa tashqi manba yo'q.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://kinescope.io https://oauth.telegram.org; connect-src 'self' https://api.telegram.org; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org" always;

    # ── Yuklangan media: diskdan to'g'ridan-to'g'ri (§4.1) ────────────────────
    location /media/ {
        alias /var/app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Ariza formasi: qattiq rate-limit (§4.5, §6) ───────────────────────────
    location /api/leads {
        limit_req zone=leads burst=3 nodelay;
        proxy_pass http://web_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        limit_req zone=general burst=120 nodelay;
        proxy_pass http://web_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

