# Clean Water — nginx, HTTP bosqichi (§4.1).
#
# HOLAT: bu bootstrap konfiguratsiyasi — sertifikat hali yo'q paytda ishlaydi.
# Sertifikat olingandan keyin prodda TLS ga o'tiladi (`docs/DEPLOY.md`):
#
#     mv default.conf default.conf.disabled
#     mv tls.conf.disabled tls.conf
#     docker compose exec nginx nginx -s reload
#
# Ikkalasi bir vaqtda yuklanmaydi: har ikkisida ham `listen 80` bor va
# ikkinchi server bloki birinchisini soya qilib qo'yardi.
#
# Zonalar va upstream lar — `upstreams.conf` da.
# Xavfsizlik sarlavhalarini ilovaning o'zi beradi (`src/lib/security-headers.ts`).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Let's Encrypt webroot tekshiruvi — sertifikat shu yerdan olinadi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    include /etc/nginx/conf.d/app_locations.inc;
}
