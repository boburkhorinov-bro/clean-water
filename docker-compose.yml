# Clean Water — bitta VPS, hammasi `docker compose` orqali (§4.1).
#
# Ishga tushirish:
#   cp env.example .env    # va qiymatlarni to'ldiring
#   docker compose up --build
#
# To'liq deploy tartibi (TLS, webhook, zaxira) — docs/DEPLOY.md.

# Loyiha nomi ATAYLAB qat'iy belgilangan. Ko'rsatilmasa Compose uni papka
# nomidan oladi va volume lar `<papka>_postgres-data` bo'lib ketardi —
# repozitoriy boshqa nom bilan klonlansa, `deploy.sh` sertifikat olayotganda
# ulaydigan `cleanwater_certbot-webroot` YANGI BO'SH volume bo'lardi va
# Let's Encrypt tekshiruvi 404 olardi.
name: cleanwater

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleanwater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleanwater}
      POSTGRES_DB: ${POSTGRES_DB:-cleanwater}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Lokal ishlab chiqish uchun ochiq; prodda bu qatorni olib tashlang —
    # baza faqat ichki tarmoqdan ko'rinishi kerak.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cleanwater}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migratsiyalar (§5) ─────────────────────────────────────────────────────
  # Bir martalik xizmat: ishlaydi, tugaydi va o'chadi. `web` uning
  # MUVAFFAQIYATLI tugashini kutadi — aks holda ilova eski sxemadagi bazaga
  # ulanib, so'rovlarni 500 bilan qaytarardi va buni faqat mijoz sezardi.
  #
  # Nega `web` ichida emas: `web` obrazida `.next/standalone` dan boshqa
  # hech narsa yo'q — na prisma CLI, na migratsiya fayllari.
  #
  # `prisma migrate deploy` idempotent, shuning uchun har `up` da ishlashi
  # muammo emas: qo'llanmagan migratsiya bo'lmasa, u bir necha soniyada
  # tugaydi.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        # `builder` bosqichi bu argumentni talab qiladi (§4.7 tekshiruvi).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Asia/Tashkent}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # `NEXT_PUBLIC_*` qurish paytida muhrlanadi — pastdagi `environment:`
        # bu qiymat uchun kech qoladi (§4.7). Ikkalasi ham kerak: build —
        # canonical/hreflang/sitemap uchun, environment — env.ts tekshiruvi
        # va server tomonidagi dinamik o'qish uchun.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Ulanishlar hovuzi bazadagi `max_connections` ga bog'liq —
      # docs/DEPLOY.md §7.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      TZ: ${TZ:-Asia/Tashkent}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Eslatmalar o'tishi va bot webhooki ham bazaga boradi: eski sxemada
      # ular yiqilardi, `restart: unless-stopped` esa buni tsiklga aylantirardi.
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_MANAGER_CHAT_ID: ${TELEGRAM_MANAGER_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      # Eslatmalarni tashqaridan ishga tushirish (§4.6). Docker da ichki
      # rejalashtiruvchi ham ishlaydi, lekin manzil qo'lda tekshirish uchun
      # ochiq turadi va sirsiz u 401 qaytaradi.
      CRON_SECRET: ${CRON_SECRET}
      WORKER_PORT: ${WORKER_PORT:-8081}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      TZ: ${TZ:-Asia/Tashkent}
    # Telegram webhooki nginx orqali keladi; tashqariga chiqarilmaydi.
    expose:
      - '8081'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Zaxira (§7) ────────────────────────────────────────────────────────────
  # Har kuni `BACKUP_HOUR` da `pg_dump` va darhol tiklab ko'rish. Alohida
  # konteyner, chunki `pg_dump` versiyasi server versiyasiga mos bo'lishi
  # kerak — shuning uchun bu ayni `postgres` image i.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ./scripts:/scripts:ro
      # Zaxiralar hostda turadi: konteyner volumeidan ko'ra ularni tashqi
      # diskka olib chiqish oson bo'lsin.
      - ./backups:/backups
    # `postgres` image ining standart entrypointi serverni ko'taradi —
    # uni butunlay almashtiramiz.
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - web
      - worker
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # Yuklangan media — nginx to'g'ridan-to'g'ri uzatadi (§4.1).
      - media:/var/app/media:ro
      # Let's Encrypt: HTTP tekshiruvi shu papkadan o'qiladi (docs/DEPLOY.md).
      - certbot-webroot:/var/www/certbot
      # TLS sertifikatlari — `tls.conf` yoqilgandan keyin kerak bo'ladi.
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres-data:
  media:
  certbot-webroot:
