# Clean Water — bitta VPS, hammasi `docker compose` orqali (§4.1).
#
# Ishga tushirish:
#   cp env.example .env    # va qiymatlarni to'ldiring
#   docker compose up --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleanwater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleanwater}
      POSTGRES_DB: ${POSTGRES_DB:-cleanwater}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Lokal ishlab chiqish uchun ochiq; prodda bu qatorni olib tashlang —
    # baza faqat ichki tarmoqdan ko'rinishi kerak.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cleanwater}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      TZ: ${TZ:-Asia/Tashkent}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_MANAGER_CHAT_ID: ${TELEGRAM_MANAGER_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TZ: ${TZ:-Asia/Tashkent}

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # Yuklangan media — nginx to'g'ridan-to'g'ri uzatadi (§4.1).
      - media:/var/app/media:ro
      # TLS sertifikatlari (Let's Encrypt) — hosting sozlangach ulanadi.
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres-data:
  media:
